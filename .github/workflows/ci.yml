name: Family Roots CI

# Everything runs on Ubuntu, like Render and Vercel. Nothing here needs a secret: the PostgreSQL database is a
# throwaway service container, and the production start-up check uses placeholder addresses that are never contacted.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend lint and tests (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt

      - name: Install backend dependencies (pinned)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          python -m pip check

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check .

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest --cov=app --cov-report=term-missing -v

  backend-postgres:
    name: Backend on PostgreSQL (tests, migrations, production start-up)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: familyroots_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt

      - name: Install backend dependencies (pinned)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Run the backend tests on PostgreSQL (schema built by the migrations)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/familyroots_test
        run: python -m pytest -v

      - name: Migrations build exactly the models (alembic upgrade head, alembic check)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyroots_ci
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic current | grep -q "(head)"

      - name: Production start-up with the Render start command
        working-directory: backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyroots_ci
          FRONTEND_ORIGIN: https://app.familyroots.example
          API_BASE_URL: https://api.familyroots.example
          TRUSTED_PROXY_HOPS: "1"
          STORAGE: supabase
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_KEY: ci-placeholder-not-a-key
          PORT: "8000"
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          START="$(python -c "import yaml; print(yaml.safe_load(open('../render.yaml'))['services'][0]['startCommand'])")"
          echo "Starting: $START"
          eval "$START" &
          SERVER=$!
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 1; done
          curl -sf http://localhost:8000/health | tee /dev/stderr | grep -q '"database":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/docs)" = "404"   # hidden in production
          kill $SERVER

      - name: Production refuses to start on a database that is behind
        working-directory: backend
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/familyroots_ci
          FRONTEND_ORIGIN: https://app.familyroots.example
          API_BASE_URL: https://api.familyroots.example
          TRUSTED_PROXY_HOPS: "1"
          STORAGE: supabase
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_KEY: ci-placeholder-not-a-key
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          python -m alembic downgrade 0002
          set +e
          timeout 30 python -m uvicorn app.main:app --port 8001 --no-proxy-headers
          code=$?
          set -e
          # 124: still running when the timeout stopped it, i.e. it started. It must have exited with an error itself.
          if [ "$code" = 0 ] || [ "$code" = 124 ]; then echo "The server started on an out-of-date schema (exit $code)"; exit 1; fi
          echo "Refused to start, as it should (exit $code)"
          python -m alembic upgrade head

  frontend-checks:
    name: Frontend lint, tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test

      - name: Build (default)
        run: npm run build

      - name: Build as Vercel production does (API address checked, CSP in index.html)
        env:
          VERCEL_ENV: production
          VITE_API_URL: https://api.familyroots.example/api/v1
        run: |
          npm run build
          grep -o '<meta http-equiv="Content-Security-Policy"[^>]*>' dist/index.html | tee /dev/stderr | grep -q "https://api.familyroots.example"

      - name: A Vercel production build without an API address is refused
        env:
          VERCEL_ENV: production
          VITE_API_URL: ""
        run: |
          if npm run build; then echo "Built without VITE_API_URL"; exit 1; fi

      - name: Build the single-file demo
        run: npm run build:single

  end-to-end-sync:
    name: App ↔ server sync (end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt -c backend/constraints.txt
          npm ci

      - name: Run the app against a throwaway backend
        working-directory: backend
        run: python scripts/live_sync_check.py
