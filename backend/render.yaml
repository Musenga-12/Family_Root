# Render Blueprint for the FamilyRoots API (FastAPI, in backend/). See DEPLOY.md → 2. The API on Render.
# Nothing secret lives here: values marked `sync: false` are asked for in the Render dashboard when the Blueprint is
# created, and SECRET_KEY is generated by Render.
services:
  - type: web
    name: familyroots-api
    runtime: python
    rootDir: backend
    # free sleeps after 15 minutes without visitors (the first request then takes about a minute) and has 512 MB;
    # starter stays awake. Either works with this app.
    plan: free
    # Put the API next to its database: choose the same area as the Neon project (Frankfurt = AWS eu-central-1).
    region: frankfurt
    # One process only: live chat and the sign-in attempt limits are kept in memory (backend/README.md).
    numInstances: 1
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt -c constraints.txt
    # --no-proxy-headers: the app works out visitors' addresses itself from TRUSTED_PROXY_HOPS; uvicorn must not
    # rewrite them from X-Forwarded-For (DEPLOY.md → Visitor addresses behind a proxy). No --workers (see above).
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers --log-level info --timeout-graceful-shutdown 20
    # 200 when the API and Neon answer. A new deploy that fails it (for example because the database isn't at the
    # latest migration, which makes the server refuse to start) never replaces the running one.
    healthCheckPath: /health
    # Migrations are applied by a person after reviewing them (DEPLOY.md → Database migrations), not on every deploy.
    # On a paid instance type Render can run them first instead:
    # preDeployCommand: alembic upgrade head
    envVars:
      # Render's own default is newer than the version this app is tested on; keep the minor version in step with
      # backend/.python-version (a test checks this).
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      # Neon: the pooled connection string (host contains -pooler), ending in ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Neon: the direct connection string, used only by `alembic upgrade head`; optional on the server itself
      - key: DATABASE_URL_DIRECT
        sync: false
      # The Vercel address of the web app, exactly https://host (no path, no trailing slash)
      - key: FRONTEND_ORIGIN
        sync: false
      # This API's own public address (https://familyroots-api.onrender.com or your own domain)
      - key: API_BASE_URL
        sync: false
      # Confirm after the first deploy with scripts/check_client_ip.py
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      # Supabase → Project settings → API → service_role key. Server only, never in the web app.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: family-files
      # Email: leave unset until a sending domain is verified (DEPLOY.md → Email). Then set EMAIL_PROVIDER=resend,
      # RESEND_API_KEY and EMAIL_FROM in the dashboard.
